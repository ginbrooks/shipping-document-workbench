name: Public regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/public_demo.py --output demo-output/calculations
      - run: python scripts/preflight_demo.py --write-browser-data
      - name: Ensure committed browser data matches the Python rules
        run: git diff --exit-code -- docs/demo/data.js docs/demo/sources
